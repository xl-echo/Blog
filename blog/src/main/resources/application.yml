server:
  port: 10080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/blog?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: admin
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  # Redis配置
  redis:
    host: localhost
    port: 6379
    password: ""
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.echo.blog.po
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Spring Cache配置
spring:
  cache:
    type: redis
    redis:
      time-to-live: 3600000  # 默认缓存过期时间1小时
      cache-null-values: false  # 不缓存null值
      use-key-prefix: true  # 使用键前缀

# 日志配置
logging:
  level:
    com.echo.blog: DEBUG
    org.springframework.cache: DEBUG
    org.springframework.data.redis: INFO
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  file:
    name: logs/blog.log
    max-size: 100MB
    max-history: 30

# 自定义配置
custom:
  cache:
    orders-ttl: 7200000  # 订单缓存过期时间2小时
    products-ttl: 10800000  # 产品缓存过期时间3小时
    articles-ttl: 3600000  # 文章缓存过期时间1小时
    users-ttl: 86400000  # 用户缓存过期时间24小时
